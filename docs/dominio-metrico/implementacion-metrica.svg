<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1460" viewBox="0 0 1440 1460" role="img" aria-labelledby="title desc">
  <title id="title">El modelo métrico aplicado</title>
  <desc id="desc">Qué parte de la ontología del verso español implementa el proyecto, dónde está la frontera, cómo recorre el dato el catálogo, la pregunta derivada y el registro, con qué escalas se declara la norma y qué falta por implementar.</desc>
  <defs>
    <style>
      .bg { fill: #f7f6f2; }
      .ink { fill: #1c1c1a; }
      .mid { fill: #55534e; }
      .muted { fill: #8a8780; }
      .faint { fill: #b0ada5; }
      .rule { fill: none; stroke: #d6d2c8; stroke-width: 1; }
      .hair { fill: none; stroke: #e0dcd2; stroke-width: 1; }
      .cut { fill: none; stroke: #c8aa98; stroke-width: 1.4; stroke-dasharray: 6 7; }
      .flow { fill: none; stroke: #6f6d67; stroke-width: 1.6; }
      .band { fill: #1c1c1a; }
      .box { fill: #fff; stroke: #d6d2c8; stroke-width: 1.2; }
      .box-accent { fill: #e8eee9; stroke: #a9bcae; stroke-width: 1.2; }
      .box-soft { fill: #efede6; stroke: #d6d2c8; stroke-width: 1.2; }
      .box-warn { fill: #f3ebe4; stroke: #cdb2a0; stroke-width: 1.2; }
      .box-derived { fill: #fff; stroke: #a9bcae; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .tag { fill: #e8eee9; stroke: #a9bcae; stroke-width: 1; }
      .display { font: 400 36px Georgia, 'Times New Roman', serif; }
      .numeral { font: italic 400 26px Georgia, 'Times New Roman', serif; fill: #c2beb4; }
      .section { font: 600 11.5px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .18em; }
      .node { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; }
      .lead { font: 400 15px Georgia, 'Times New Roman', serif; }
      .item { font: 400 13.5px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .micro { font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; }
      .note { font: italic 400 13px Georgia, 'Times New Roman', serif; }
      .white { fill: #fff; }
    </style>
    <marker id="tip" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0.5 L 9 5 L 0 9.5 z" fill="#6f6d67"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="1460"/>

  <!-- Cabecera -->
  <text x="140" y="94" class="display ink">El modelo métrico aplicado</text>
  <text x="140" y="124" class="note muted">Qué parte de la ontología se realiza, qué se restringe por el corpus y cómo se recoge el dato.</text>
  <text x="1368" y="94" text-anchor="end" class="small muted">10 · 08 · 2026</text>
  <line x1="140" y1="152" x2="1368" y2="152" class="rule"/>

  <!-- I · La frontera -->
  <text x="72" y="216" class="numeral">I</text>
  <text x="140" y="212" class="section mid">LA FRONTERA</text>

  <line x1="754" y1="232" x2="754" y2="400" class="cut"/>

  <text x="140" y="244" class="node ink">SE IMPLEMENTA</text>
  <text x="140" y="278" class="item mid">Medida del verso · el arte se deriva</text>
  <text x="140" y="306" class="item mid">Verso compuesto, cesura y hemistiquios</text>
  <text x="140" y="334" class="item mid">Rima: tipo, clase, esquema, posiciones, enlaces</text>
  <text x="140" y="362" class="item mid">Unidad, secciones, repetición léxica</text>
  <text x="140" y="390" class="item mid">Forma, variedad, denominación, tradición, relación</text>

  <text x="800" y="244" class="node faint">QUEDA FUERA</text>
  <text x="800" y="278" class="item faint">Ley del acento final</text>
  <text x="800" y="306" class="item faint">Sinalefa, dialefa, sinéresis, diéresis</text>
  <text x="800" y="334" class="item faint">Ritmo: acentos, ictus, cláusulas, perfiles</text>
  <text x="800" y="362" class="item faint">Encabalgamiento y pausas</text>
  <text x="800" y="390" class="item faint">Licencias métricas · certeza de la anotación</text>

  <text x="140" y="436" class="note muted">El proyecto no almacena el texto de las obras: esa es la frontera que decide qué mitad de la ontología puede implementarse aquí.</text>
  <text x="1368" y="436" text-anchor="end" class="note muted">El verso libre y el fluctuante son formas en la ontología; aquí, tramos sin forma.</text>

  <!-- II · El recorrido del dato -->
  <text x="72" y="500" class="numeral">II</text>
  <text x="140" y="496" class="section mid">EL RECORRIDO DEL DATO</text>

  <text x="140" y="540" class="node ink">CATÁLOGO</text>
  <text x="560" y="540" class="node ink">PREGUNTA</text>
  <rect x="654" y="528" width="76" height="16" rx="8" class="tag"/>
  <text x="692" y="540" text-anchor="middle" class="micro mid">DERIVADA</text>
  <text x="980" y="540" class="node ink">REGISTRO</text>

  <!-- Catálogo -->
  <rect x="140" y="558" width="372" height="54" rx="4" class="box-accent"/>
  <text x="166" y="583" class="node ink">FORMA</text>
  <text x="166" y="603" class="small muted">identidad asignable a una secuencia</text>

  <rect x="140" y="628" width="372" height="54" rx="4" class="box"/>
  <text x="166" y="653" class="node ink">ARQUITECTURA</text>
  <text x="166" y="673" class="small muted">estructura constante de la unidad</text>

  <rect x="140" y="698" width="372" height="106" rx="4" class="box-soft"/>
  <text x="166" y="723" class="item ink">Esquema métrico · esquema de rima</text>
  <text x="166" y="747" class="item ink">Secciones · repeticiones</text>
  <text x="166" y="771" class="item ink">Rasgos con valores · variedades</text>
  <text x="166" y="795" class="small muted">y las fuentes que sostienen cada afirmación</text>

  <path d="M 326 612 L 326 628" class="flow" marker-end="url(#tip)"/>
  <path d="M 326 682 L 326 698" class="flow" marker-end="url(#tip)"/>

  <!-- Pregunta -->
  <rect x="560" y="558" width="372" height="54" rx="4" class="box-derived"/>
  <text x="586" y="583" class="node ink">ENUNCIADO</text>
  <text x="586" y="603" class="small muted">sale del rasgo o de la forma, no se escribe</text>

  <rect x="560" y="628" width="372" height="54" rx="4" class="box-derived"/>
  <text x="586" y="653" class="node ink">OPCIONES</text>
  <text x="586" y="673" class="small muted">son las entidades que la arquitectura admite</text>

  <rect x="560" y="698" width="372" height="106" rx="4" class="box-soft"/>
  <text x="586" y="723" class="item ink">Toda opción apunta a una entidad</text>
  <text x="586" y="747" class="item ink">ya normalizada, nunca a texto libre</text>
  <text x="586" y="771" class="small muted">Con una sola opción no hay pregunta: se deriva</text>
  <text x="586" y="795" class="small muted">Ninguna pregunta puede quedarse sin opciones</text>

  <path d="M 746 612 L 746 628" class="flow" marker-end="url(#tip)"/>
  <path d="M 746 682 L 746 698" class="flow" marker-end="url(#tip)"/>

  <!-- Registro -->
  <rect x="980" y="558" width="388" height="54" rx="4" class="band"/>
  <text x="1006" y="583" class="node white">SECUENCIA</text>
  <text x="1006" y="603" class="small white">forma · arquitectura · rango</text>

  <rect x="980" y="628" width="388" height="54" rx="4" class="box"/>
  <text x="1006" y="653" class="node ink">REALIZACIONES</text>
  <text x="1006" y="673" class="small muted">la unidad y sus secciones, cada aparición</text>

  <rect x="980" y="698" width="388" height="106" rx="4" class="box-soft"/>
  <text x="1006" y="723" class="item ink">Respuestas registradas</text>
  <text x="1006" y="747" class="item ink">Desviaciones localizadas por rango</text>
  <text x="1006" y="771" class="small muted">La respuesta apunta al dato, no a la opción</text>
  <text x="1006" y="795" class="small muted">mundo cerrado: sin desviaciones, es conforme</text>

  <path d="M 1174 612 L 1174 628" class="flow" marker-end="url(#tip)"/>
  <path d="M 1174 682 L 1174 698" class="flow" marker-end="url(#tip)"/>

  <path d="M 512 585 L 560 585" class="flow" marker-end="url(#tip)"/>
  <path d="M 932 585 L 980 585" class="flow" marker-end="url(#tip)"/>

  <line x1="140" y1="838" x2="1368" y2="838" class="hair"/>
  <text x="140" y="866" class="note muted">La columna del medio no se guarda: se calcula al leer, así que el catálogo y las preguntas no pueden decir cosas distintas.</text>
  <text x="1368" y="866" text-anchor="end" class="note muted">Lo que la arquitectura fija no se pregunta.</text>

  <!-- III · Con qué se declara la norma -->
  <text x="72" y="934" class="numeral">III</text>
  <text x="140" y="930" class="section mid">CON QUÉ SE DECLARA LA NORMA</text>

  <line x1="532" y1="952" x2="532" y2="1128" class="hair"/>
  <line x1="944" y1="952" x2="944" y2="1128" class="hair"/>

  <text x="140" y="982" class="node ink">MODALIDAD</text>
  <text x="140" y="1010" class="lead mid">Cuánto ha fijado la tradición</text>
  <text x="140" y="1044" class="item muted">definitoria · se da siempre</text>
  <text x="140" y="1068" class="item muted">habitual · las fuentes la dan por corriente</text>
  <text x="140" y="1092" class="item muted">admitida · ya no extraña a la crítica</text>
  <text x="140" y="1116" class="item muted">excepcional · documentada como rara</text>

  <text x="552" y="982" class="node ink">ALCANCE</text>
  <text x="552" y="1010" class="lead mid">De qué se responde</text>
  <text x="552" y="1044" class="item muted">secuencia · una vez para todo el pasaje</text>
  <text x="552" y="1068" class="item muted">unidad · una vez por unidad</text>
  <text x="552" y="1092" class="item muted">realización · en cada aparición de su sección</text>
  <text x="552" y="1116" class="small muted">el estribillo puede volver entero tras una copla y en parte tras otra</text>

  <text x="964" y="982" class="node ink">POSICIONES O RESTRICCIONES</text>
  <text x="964" y="1010" class="lead mid">Las dos maneras de decir un esquema</text>
  <text x="964" y="1044" class="item muted">Un esquema sin posiciones no está incompleto</text>
  <text x="964" y="1068" class="item muted">Su norma son sus restricciones</text>
  <text x="964" y="1092" class="item muted">y los concretos que conviven con él la cumplen</text>
  <text x="964" y="1116" class="small muted">de las de la quintilla se derivan sus ocho disposiciones</text>

  <line x1="140" y1="1152" x2="1368" y2="1152" class="hair"/>
  <text x="140" y="1180" class="note muted">Una escala de frecuencia, no de obligación: la norma métrica española es resultado de la práctica, y por eso lo definitorio es su tope y no otro eje.</text>

  <!-- IV · Lo que falta -->
  <text x="72" y="1248" class="numeral">IV</text>
  <text x="140" y="1244" class="section mid">LO QUE FALTA</text>

  <rect x="140" y="1266" width="1228" height="86" rx="4" class="box-warn"/>
  <text x="172" y="1298" class="node ink">LA REALIZACIÓN NO ESTÁ MATERIALIZADA</text>
  <text x="172" y="1326" class="lead mid">Saber qué mide el verso 47 obliga a resolver la norma uniendo por el catálogo, en vez de leerlo del registro</text>

  <line x1="504" y1="1376" x2="504" y2="1394" class="hair"/>
  <line x1="896" y1="1376" x2="896" y2="1394" class="hair"/>

  <text x="140" y="1390" class="item ink">Desviaciones</text>
  <text x="290" y="1390" class="small muted">solo en el editor de pruebas</text>

  <text x="532" y="1390" class="item ink">Error de transmisión</text>
  <text x="700" y="1390" class="small muted">no se distingue de la desviación</text>

  <text x="924" y="1390" class="item ink">Procedencia normativa</text>
  <text x="1104" y="1390" class="small muted">métrica española o decisión del corpus</text>

  <!-- Cierre -->
  <line x1="140" y1="1418" x2="1368" y2="1418" class="rule"/>
  <text x="140" y="1442" class="note muted">Regla de comparabilidad: un hecho debe quedar registrado igual venga de la norma, de una elección o de una desviación.</text>
</svg>
